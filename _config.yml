title: Olivia's Portfolio
description: A digital museum to showcase all my best photos

# Every page uses _layouts/default.html unless its front matter says otherwise
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Files Jekyll should NOT copy into the built site
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - src
  - README.md
  - images/title-cards/README.md
  - head-snippets.html
  - index-skeleton.html
