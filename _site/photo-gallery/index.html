<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Look at all them photos</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1 class="p-24">Photo gallery</h1>

  <section class="max-w-6xl mx-auto px-4 pb-12">
    
    

    

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      
        
        
          <a href="/images/gallery/apple.jpg" target="_blank" class="block overflow-hidden rounded-lg">
            <img
              src="/images/gallery/apple.jpg"
              alt="apple"
              loading="lazy"
              class="w-full aspect-square object-cover hover:scale-105 transition-transform duration-300">
          </a>
        
      
        
        
          <a href="/images/gallery/Curly-Haired%20Young%20Man%20Portrait.png" target="_blank" class="block overflow-hidden rounded-lg">
            <img
              src="/images/gallery/Curly-Haired%20Young%20Man%20Portrait.png"
              alt="Curly Haired Young Man Portrait"
              loading="lazy"
              class="w-full aspect-square object-cover hover:scale-105 transition-transform duration-300">
          </a>
        
      
    </div>
  </section>
</body>
</html>
