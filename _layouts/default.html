<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <!-- ?v=<build time> gives the file a new URL on every build, so browsers can't reuse an old cached copy -->
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="flex min-h-screen flex-col {% if page.theme == 'dark' %}bg-neutral-950 text-neutral-200{% else %}bg-stone-50 text-neutral-800{% endif %}">
  {% include nav.html %}
  {% include title-card.html %}

  <main class="flex-1">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
