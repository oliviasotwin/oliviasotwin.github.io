<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1530"/><stop offset="1" stop-color="#3b5b8a"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="140"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.18 0"/></filter>
  </defs>
  <rect width="2400" height="1200" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.85">
    <circle cx="1700" cy="350" r="420" fill="#8f4d8a"/>
    <circle cx="2050" cy="700" r="260" fill="#f2a17a"/>
    <circle cx="500" cy="950" r="380" fill="#3b5b8a"/>
  </g>
  <rect width="2400" height="1200" filter="url(#grain)"/>
</svg>
